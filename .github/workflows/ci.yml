name: CI & Safety Hygiene

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  safety-and-hygiene:
    name: Security, Secrets & Path Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Repository Safety Checker
        run: python scripts/check_repo_safety.py

  windows-build-and-test:
    name: Windows Native C++20 Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Native Binaries
        run: |
          cmake --build build --config Release

      - name: Run Native Core Tests (CTest)
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Run End-to-End Integration Tests
        env:
          DYNAMIC_CURSOR_BIN: ${{ github.workspace }}/build/Release/dynamic-cursor-tray.exe
        run: |
          pytest tests/test_e2e_daemon.py -v
